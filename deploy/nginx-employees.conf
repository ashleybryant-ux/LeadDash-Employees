# nginx site for LeadDash Employees. ASSUMPTION: the EC2 box serves HTTPS
# through nginx with certbot. Check with the command in README before using.
server {
    listen 80;
    server_name employees.leaddash.io;

    client_max_body_size 300m;   # pitch videos, RFPs and signed forms upload here

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # web searches can take a few minutes
    }
}
